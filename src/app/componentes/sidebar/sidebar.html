<nav class="sidebar">
  <!-- Logo de tu red social -->
  <div class="brand">
    <h2>EA</h2>
  </div>

  <div class="nav-links">
    <!-- Botón Inicio (Feed) -->
    <a routerLink="/publicaciones" routerLinkActive="active-link" class="nav-item">
      <!-- Icono de casa básico -->
      <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </a>

    <!-- Botón de perfil admin (Feed) -->
     @if(perfilUsuario === 'admin'){
       <a routerLink="/dashboard" routerLinkActive="active-link" class="nav-item">
         <!-- Icono de casa básico -->
         <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none">
           <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
           <polyline points="9 22 9 2 1 12 1 22"></polyline>
         </svg>
       </a>

       <a routerLink="/dashboard/estadisticas" routerLinkActive="active-link" class="nav-item">
         <!-- Icono de casa básico -->
         <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none">
           <path d="M3 9l9 1-2 2H5a2 2 0 0 1-2-2z"></path>
           <polyline points="9 22 9 2 1 12 1 22"></polyline>
         </svg>
       </a>
     }

    <!-- Botón Mi Perfil (Foto circular) -->
    <a routerLink="/mi-perfil" routerLinkActive="active-link" class="nav-item profile-item">
      @if (imagenPerfil) {
        <img [src]="imagenPerfil" alt="Perfil" class="nav-avatar">
      } @else {
        <div class="nav-avatar-placeholder"></div>
      }
    </a>
  </div>

 <!-- Botón Cerrar Sesión -->
    <a class="nav-item" (click)="cerrarSesion()" title="Cerrar sesión" style="color: #fca5a5;">
      <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </a>
